<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente Lumina</title>
    <!-- Link para o arquivo CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon_study.png') }}" type="image/x-icon">
</head>
<body>
    <div class="chat-container">
        <!-- Cabeçalho do Chat -->
        <header class="chat-header">
            <h1>🎓 Instituto Lumina</h1>
            <p>Secretaria Virtual e Suporte Acadêmico</p>
        </header>

        <!-- Área onde as mensagens aparecem -->
        <div class="chat-messages" id="chatMessages">
             <!-- Mensagem automática -->
            <div class="message bot-message">Olá! Sou o assistente virtual da nossa instituição de ensino. Como posso te ajudar com os cursos, matrículas ou suporte acadêmico hoje?</div>
        </div>

        <!-- Área de digitação do usuário -->
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Digite sua dúvida..." autocomplete="off">
            <button id="sendButton" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <!-- Link para o arquivo JavaScript separado -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
